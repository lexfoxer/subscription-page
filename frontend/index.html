<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="color-scheme" content="dark only" />
        <meta name="theme-color" content="#161B23" />
        <meta
            name="viewport"
            content="minimum-scale=1, initial-scale=1, width=device-width, user-scalable=no"
        />
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="icon" sizes="32x32" type="image/png" href="/assets/favicon-32x32.png" />
        <link rel="icon" sizes="16x16" type="image/png" href="/assets/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180x180.png" />

        <link rel="preconnect" crossorigin="anonymous" href="https://fonts.googleapis.com" />
        <link rel="preconnect" crossorigin="anonymous" href="https://fonts.gstatic.com" />

        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@200..900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&display=swap"
            rel="stylesheet"
        />

        <meta name="description" content="<%- metaDescription %>" />
        <title><%- metaTitle %></title>
        <script>
            // Startup diagnostics: if the app has not mounted after 6 s, show what went wrong
            // (JS errors, failed asset loads) instead of a blank page.
            (function () {
                var errors = [];
                window.addEventListener(
                    'error',
                    function (e) {
                        var t = e.target;
                        if (t && (t.src || t.href) && t !== window) {
                            errors.push('failed to load ' + String(t.src || t.href).split('/').pop());
                            return;
                        }
                        errors.push(
                            (e.message || 'error') +
                                (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')
                        );
                    },
                    true
                );
                window.addEventListener('unhandledrejection', function (e) {
                    var r = e.reason;
                    errors.push('unhandled: ' + ((r && (r.stack || r.message)) || String(r)));
                });
                setTimeout(function () {
                    var root = document.getElementById('root');
                    if (!root || root.childElementCount > 0) return;
                    var box = document.createElement('pre');
                    box.style.cssText =
                        'position:fixed;left:8px;right:8px;bottom:8px;max-height:60vh;overflow:auto;' +
                        'padding:12px;border-radius:8px;background:#2a1215;color:#ffb4b4;' +
                        'font:12px/1.4 monospace;white-space:pre-wrap;word-break:break-word;z-index:9999';
                    box.textContent =
                        'The page failed to start.\n' +
                        (errors.length ? errors.join('\n') : 'No JS errors captured; check network and cookies.') +
                        '\n\nUA: ' + navigator.userAgent +
                        '\ncookies enabled: ' + navigator.cookieEnabled;
                    document.body.appendChild(box);
                }, 6000);
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./src/main.tsx"></script>

        <div id="sbpg" data-panel="<%- panelData %>" data-features="<%- featuresData %>"></div>
    </body>
</html>
